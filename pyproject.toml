[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sniffle"
version = "0.1.0"
description = "A small CLI tool for text cleanup and summarization tasks."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Copilot" }]

[project.scripts]
sniffle = "sniffle.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
